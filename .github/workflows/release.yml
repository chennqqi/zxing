name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI (CGO backend)
        run: |
          CGO_ENABLED=1 \
          CGO_CFLAGS="-I$(pwd)/include" \
          CGO_CXXFLAGS="-std=c++20 -I$(pwd)/include" \
          CGO_LDFLAGS="-L$(pwd)/lib/linux-x64 -lzxingwrapper -lZXing -lstdc++ -lm" \
          go build -buildvcs=false -o zxing-cli-linux-x64 ./cmd/zxing-cli

      - name: Build CLI (WASM backend)
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -o zxing-cli-wasm ./cmd/zxing-cli

      - name: Test before release
        run: |
          ./zxing-cli-linux-x64 -i testdata/qrcode_test.png --try-harder
          ./zxing-cli-wasm -i testdata/qrcode_test.png --try-harder --backend wasm

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp zxing-cli-linux-x64 release-assets/
          cp zxing-cli-wasm release-assets/
          for d in linux-x64 linux-arm64 windows-x64 windows-arm64 darwin-x64 darwin-arm64; do
            if [ -d "lib/$d" ]; then
              tar czf "release-assets/libraries-$d.tar.gz" -C "lib/$d" .
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: release-assets/*
          if-no-files-found: error

  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW-w64 to PATH
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> $GITHUB_PATH

      # -static links the MinGW C++ runtime so the release binary runs on
      # machines without matching MinGW DLLs installed.
      - name: Build CLI (CGO backend)
        shell: bash
        run: |
          CGO_ENABLED=1 \
          CGO_CFLAGS="-I$(pwd)/include" \
          CGO_CXXFLAGS="-std=c++20 -I$(pwd)/include" \
          CGO_LDFLAGS="-L$(pwd)/lib/windows-x64 -lzxingwrapper -lZXing -lstdc++ -static" \
          go build -buildvcs=false -o zxing-cli-windows-x64.exe ./cmd/zxing-cli

      - name: Build CLI (WASM backend)
        shell: bash
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -o zxing-cli-windows-wasm.exe ./cmd/zxing-cli

      - name: Test before release
        shell: bash
        run: |
          ./zxing-cli-windows-x64.exe -i testdata/qrcode_test.png --try-harder
          ./zxing-cli-windows-wasm.exe -i testdata/qrcode_test.png --try-harder --backend wasm

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: |
            zxing-cli-windows-x64.exe
            zxing-cli-windows-wasm.exe
          if-no-files-found: error

  # Linux arm64 CLI built inside the Rocky Linux 8 container so the linked
  # binary keeps the glibc 2.28 compatibility floor (same strategy as x64).
  release-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build CLI in Rocky Linux 8 container (CGO backend)
        run: |
          docker build -t zxing-linux-arm64-build -f docker/Dockerfile.linux-arm64-build docker/
          docker run --rm -v "$PWD":/workspace:Z zxing-linux-arm64-build sh -c "
            cd /workspace && \
            CGO_ENABLED=1 \
            go build -buildvcs=false -o zxing-cli-linux-arm64 ./cmd/zxing-cli && \
            ./zxing-cli-linux-arm64 -i testdata/qrcode_test.png --try-harder
          "
          mkdir -p release-assets && cp zxing-cli-linux-arm64 release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-arm64
          path: release-assets/zxing-cli-linux-arm64
          if-no-files-found: error

  # macOS CLIs on both architectures (Intel runner + Apple Silicon runner)
  release-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI (CGO backend)
        run: |
          CGO_ENABLED=1 \
          go build -buildvcs=false -o zxing-cli-darwin-${{ matrix.arch }} ./cmd/zxing-cli

      - name: Build CLI (WASM backend)
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -o zxing-cli-darwin-${{ matrix.arch }}-wasm ./cmd/zxing-cli

      - name: Test before release
        run: |
          ./zxing-cli-darwin-${{ matrix.arch }} -i testdata/qrcode_test.png --try-harder
          ./zxing-cli-darwin-${{ matrix.arch }}-wasm -i testdata/qrcode_test.png --try-harder --backend wasm

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos-${{ matrix.arch }}
          path: |
            zxing-cli-darwin-${{ matrix.arch }}
            zxing-cli-darwin-${{ matrix.arch }}-wasm
          if-no-files-found: error

  # Windows arm64 CLI on the native arm64 runner (clang CGO toolchain)
  release-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup MSYS2 CLANGARM64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          install: >-
            mingw-w64-clang-aarch64-toolchain

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # msys2 {0} shell runs inside CLANGARM64 with the right PATH; MSYS2 is
      # extracted under RUNNER_TEMP on this image, not C:/msys64.
      - name: Build CLI (CGO backend)
        shell: msys2 {0}
        env:
          CC: clang
          CXX: clang++
          CGO_LDFLAGS: -static
        run: |
          CGO_ENABLED=1 \
          go build -buildvcs=false -o zxing-cli-windows-arm64.exe ./cmd/zxing-cli

      - name: Build CLI (WASM backend)
        shell: bash
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -o zxing-cli-windows-arm64-wasm.exe ./cmd/zxing-cli

      - name: Test before release
        shell: bash
        run: |
          ./zxing-cli-windows-arm64.exe -i testdata/qrcode_test.png --try-harder
          ./zxing-cli-windows-arm64-wasm.exe -i testdata/qrcode_test.png --try-harder --backend wasm

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows-arm64
          path: |
            zxing-cli-windows-arm64.exe
            zxing-cli-windows-arm64-wasm.exe
          if-no-files-found: error

  release:
    needs: [release-linux, release-linux-arm64, release-windows, release-windows-arm64, release-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
